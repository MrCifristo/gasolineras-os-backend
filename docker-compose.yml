version: '3.8'
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: gasfuel_db
      POSTGRES_USER: gasfuel_user
      POSTGRES_PASSWORD: gasfuel_pass
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
