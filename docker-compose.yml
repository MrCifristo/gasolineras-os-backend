services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: gasfuel_db
      POSTGRES_USER: gasfuel_user
      POSTGRES_PASSWORD: gasfuel_pass
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # Almacenamiento S3-compatible para desarrollo (equivalente local de R2).
  # En prod se usa Cloudflare R2; el SDK y el código son los mismos.
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: gasfuel_minio
      MINIO_ROOT_PASSWORD: gasfuel_minio_pass
    ports:
      - '9000:9000' # API S3
      - '9001:9001' # consola web
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  minio_data:
