services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: gasfuel_db
      POSTGRES_USER: gasfuel_user
      POSTGRES_PASSWORD: gasfuel_pass
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # Almacenamiento S3-compatible para desarrollo (equivalente local de R2).
  # En prod se usa Cloudflare R2; el SDK y el código son los mismos.
  # RustFS reemplaza a MinIO, que dejó de publicar imágenes en Docker Hub.
  # Se conservan las credenciales gasfuel_minio para no tocar los .env.
  rustfs:
    image: rustfs/rustfs:1.0.0
    environment:
      RUSTFS_ACCESS_KEY: gasfuel_minio
      RUSTFS_SECRET_KEY: gasfuel_minio_pass
      RUSTFS_CONSOLE_ENABLE: 'true'
    ports:
      - '9000:9000' # API S3
      - '9001:9001' # consola web
    volumes:
      - rustfs_data:/data

volumes:
  postgres_data:
  rustfs_data:
